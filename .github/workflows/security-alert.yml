name: Security alert

on:
  workflow_run:
    workflows:
      - Security
    types:
      - completed

permissions: {}

jobs:
  open-issue:
    name: open issue for failed scheduled security run
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Open or update the security alert issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="Scheduled security check failed"
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "The scheduled Security run failed again.

          Run: $RUN_URL
          Commit: \`$RUN_SHA\`"
            exit 0
          fi
          gh issue create --title "$title" --body "The weekly scheduled run of the Security workflow failed on \`main\`.

          Run: $RUN_URL
          Commit: \`$RUN_SHA\`

          The repository code may be unchanged. A scheduled failure usually means that a
          new public advisory now affects a pinned dependency, or that a scan reports a
          new finding.

          First steps:

          1. Open the run and identify the failed job: dependency audit, Bandit, or Gitleaks.
          2. For the dependency audit, read the advisory IDs and fixed versions in the job log.
          3. Refresh the affected lock files in a pull request, following \`requirements/README.md\`.
          4. Close this issue after the next Security run on \`main\` passes."
