[build-system]
requires = [
    "setuptools==84.0.0",
    "wheel==0.48.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "qstriage"
version = "1.4.1"
description = "Local, deterministic engine that turns cryptographic inventories and CBOM evidence into verifiable PQC migration decision records."
readme = "README.md"
authors = [
    { name = "Ilias Tekeoglou" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "post-quantum cryptography",
    "PQC",
    "CBOM",
    "cryptographic inventory",
    "decision support",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "networkx>=3.6.1",
    "typer>=0.27.3",
    "rich>=15.0.0"
]

[project.urls]
Homepage = "https://github.com/ILIASTEKEOGLOU/QSTriage"
Documentation = "https://github.com/ILIASTEKEOGLOU/QSTriage#documentation"
Repository = "https://github.com/ILIASTEKEOGLOU/QSTriage"
Issues = "https://github.com/ILIASTEKEOGLOU/QSTriage/issues"
Changelog = "https://github.com/ILIASTEKEOGLOU/QSTriage/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "mcp>=2.3.0,<3",
    "pytest>=9.1.1"
]
mcp = [
    "mcp>=2.3.0,<3"
]

[project.scripts]
qstriage = "qstriage.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["qstriage"]

[tool.setuptools.package-data]
qstriage = ["algorithm_registry.json"]

[tool.pip-tools]
generate-hashes = true
strip-extras = true
resolver = "backtracking"
